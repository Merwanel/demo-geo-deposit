volumes:
  geonetwork:
  esdata:
  pgdata:

services:
  geonetwork:
    image: geonetwork:4.4.12
    healthcheck:
      test: curl -f http://localhost:8080/geonetwork/srv/eng/catalog.search || exit 1
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    volumes:
      - geonetwork:/catalogue-data
    depends_on:
      database:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-Xms512M -Xss1M -Xmx2G -XX:+UseConcMarkSweepGC --add-opens=jdk.management/com.sun.management.internal=ALL-UNNAMED"
      GN_CONFIG_PROPERTIES: >-
        -Dgeonetwork.dir=/catalogue-data
        -Des.host=elasticsearch
        -Des.protocol=http
        -Des.port=9200
        -Des.url=http://elasticsearch:9200
      GEONETWORK_DB_TYPE: postgres
      GEONETWORK_DB_HOST: database
      GEONETWORK_DB_PORT: 5432
      GEONETWORK_DB_NAME: geonetwork
      GEONETWORK_DB_USERNAME: geonetwork
      GEONETWORK_DB_PASSWORD: geonetwork

  database:
    image: postgres:17.6
    environment:
      POSTGRES_USER: geonetwork
      POSTGRES_PASSWORD: geonetwork
      POSTGRES_DB: geonetwork
    healthcheck:
      test: ["CMD-SHELL", "psql -U geonetwork -d geonetwork -c 'select 1' > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  elasticsearch:
    image: elasticsearch:8.19.13
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: curl -s http://localhost:9200 >/dev/null || exit 1
      interval: 10s
      timeout: 2s
      retries: 10
      start_period: 2m
    environment:
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      discovery.type: single-node
      xpack.security.enabled: "false"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  api:
    build: .
    healthcheck:
      test: curl -f http://127.0.0.1:80/docs || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "8000:80"
    environment:
      GN_BASE_URL: http://geonetwork:8080/geonetwork
      GN_PUBLIC_URL: http://localhost:8080/geonetwork
      GN_USERNAME: admin
      GN_PASSWORD: admin
      GN_GROUP: sample
      DATAVERSE_TOKEN: ${DATAVERSE_TOKEN:-}
      DATAVERSE_BASE_URL: ${DATAVERSE_BASE_URL:-https://demo.dataverse.org}
      DATAVERSE_COLLECTION: ${DATAVERSE_COLLECTION:-root}
    depends_on:
      geonetwork:
        condition: service_healthy

  seed:
    image: curlimages/curl:8.12.1
    restart: "no"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./scripts/seed.sh:/seed.sh:ro
      - ./samples/two-cities.geojson:/samples/two-cities.geojson:ro
    entrypoint: ["/bin/sh", "/seed.sh"]
